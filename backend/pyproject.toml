[project]
name = "gta-clips-ai-backend"
version = "0.1.0"
description = "Local backend for GTA Clips AI: imports GTA RP recordings and turns them into short vertical clips."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2.0",
    "structlog>=24.1",
    "httpx>=0.27,<1.0",
    "faster-whisper>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["E501"]
"tests/**" = ["S603", "S607"]  # tests run ffmpeg to generate sample videos

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true  # the package ships no type information

[tool.pytest.ini_options]
testpaths = ["tests"]
